# app-secrets — referenced by main-api, torrent-worker, drive-worker
# Create with: kubectl create secret generic app-secrets -n <namespace> --from-env-file=.env
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: app
type: Opaque
stringData:
  AUTH0_DOMAIN: ""
  AUTH0_AUDIENCE: ""
  AUTH0_MGMT_CLIENT_ID: ""
  AUTH0_MGMT_CLIENT_SECRET: ""
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
  GOOGLE_REDIRECT_URI: ""
  MONGODB_URI: ""
  REDIS_URL: ""
  TMDB_API_KEY: ""
  OPENSUBTITLES_API_KEY: ""
  ENCRYPTION_KEY: ""
  OBJECT_STORAGE_URL: ""
  OBJECT_STORAGE_BUCKET: "downloads"
