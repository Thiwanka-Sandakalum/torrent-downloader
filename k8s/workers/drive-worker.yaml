apiVersion: apps/v1
kind: Deployment
metadata:
  name: drive-worker
  namespace: workers
  labels:
    app: drive-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: drive-worker
  template:
    metadata:
      labels:
        app: drive-worker
    spec:
      containers:
        - name: drive-worker
          image: torrent-hunt/drive-worker:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: app-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
